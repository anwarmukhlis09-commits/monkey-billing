<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Tutorial - 3D Glow Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #4F46E5;
            --text-dark: #1E293B;
            --text-gray: #64748B;
            --bg-light: #F8FAFC; /* White-ish just like the provided example */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            padding: 4rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6rem;
        }

        /* --- 3D Phone Visual Section --- */
        .visual-section {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1500px; /* Gives realistic 3D depth */
            min-height: 500px;
        }

        /* The blue magical glow behind the phone */
        .glow-background {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle at center, rgba(59, 130, 246, 0.4) 0%, rgba(99, 102, 241, 0.2) 30%, rgba(255,255,255,0) 70%);
            z-index: 1;
            border-radius: 50%;
            filter: blur(50px);
        }

        /* Sparkles / Stars */
        .sparkle {
            position: absolute;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px rgba(255,255,255,0.9);
            z-index: 2;
        }
        .s1 { width: 5px; height: 5px; top: 10%; left: 0%; animation: twinkle 1.5s infinite alternate; }
        .s2 { width: 3px; height: 3px; bottom: 15%; right: 5%; animation: twinkle 2s infinite alternate; }
        .s3 { width: 6px; height: 6px; top: 50%; left: -10%; animation: twinkle 2.5s infinite alternate; }
        .s4 { width: 4px; height: 4px; top: 30%; right: -5%; animation: twinkle 1s infinite alternate; box-shadow: 0 0 10px 2px rgba(129, 140, 248, 0.9); }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        /* Floating 3D Phone */
        .phone-mockup {
            position: relative;
            z-index: 10;
            width: 270px;
            height: 570px;
            background-color: #0F172A; /* Phone outer casing */
            border-radius: 40px;
            
            /* Magic 3D rotation properties */
            transform-style: preserve-3d;
            transform: rotateY(20deg) rotateX(10deg) rotateZ(-5deg);
            
            /* Realistic shadows to make it float */
            box-shadow: 
                -40px 50px 60px rgba(0, 0, 0, 0.15),
                inset 0 0 0 6px #64748B; /* Metallic rim reflection */
            
            animation: float 6s ease-in-out infinite;
        }

        /* 3D Side depth (Left Edge) */
        .phone-mockup::before {
            content: '';
            position: absolute;
            left: -14px;
            top: 25px;
            bottom: 25px;
            width: 14px;
            background: linear-gradient(to bottom, #94A3B8, #475569);
            transform-origin: right;
            transform: rotateY(-90deg);
            border-radius: 12px 0 0 12px;
        }

        /* 3D Bottom depth */
        .phone-mockup::after {
            content: '';
            position: absolute;
            bottom: -14px;
            left: 25px;
            right: 25px;
            height: 14px;
            background: linear-gradient(to right, #475569, #1E293B);
            transform-origin: top;
            transform: rotateX(-90deg);
            border-radius: 0 0 12px 12px;
        }

        /* The Screen itself */
        .phone-screen {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            background-color: #fff;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
        }

        .phone-screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        @keyframes float {
            0%   { transform: rotateY(20deg) rotateX(10deg) rotateZ(-5deg) translateY(0px); }
            50%  { transform: rotateY(18deg) rotateX(8deg) rotateZ(-4deg) translateY(-20px); }
            100% { transform: rotateY(20deg) rotateX(10deg) rotateZ(-5deg) translateY(0px); }
        }

        /* --- Text / Content Section --- */
        .text-section {
            flex: 1;
            padding-right: 2rem;
            max-width: 500px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            color: var(--text-dark);
            line-height: 1.2;
            margin-bottom: 2rem;
            letter-spacing: -0.03em;
        }

        h1 span {
            color: var(--primary-blue);
        }

        p {
            font-size: 1.3rem;
            color: var(--text-gray);
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }

        /* Memberi penekanan khusus pada teks sesuai instruksi */
        p strong {
            color: var(--text-dark);
            font-weight: 700;
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                text-align: center;
                gap: 4rem;
                padding: 2rem;
            }
            .text-section {
                padding-right: 0;
            }
            h1 {
                font-size: 2.5rem;
            }
            p {
                font-size: 1.15rem;
            }
            /* Simplify 3D effect on mobile for better viewing */
            .phone-mockup {
                transform: rotateY(0deg) rotateX(0deg) rotateZ(0deg) !important;
                animation: float-mobile 4s ease-in-out infinite;
                margin-top: 2rem;
            }
            .phone-mockup::before, .phone-mockup::after {
                display: none;
            }
        }

        @keyframes float-mobile {
            0%   { transform: translateY(0px); }
            50%  { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Bagian Kiri: HP 3D Floating -->
        <div class="visual-section">
            <!-- Elemen Glow dan Bintang/Sparkle di background -->
            <div class="glow-background"></div>
            <div class="sparkle s1"></div>
            <div class="sparkle s2"></div>
            <div class="sparkle s3"></div>
            <div class="sparkle s4"></div>
            
            <!-- Mockup HP 3D -->
            <div class="phone-mockup">
                <div class="phone-screen">
                    <!-- Ganti gambar-dashboard.jpg dengan file gambar dari komputer Anda -->
                    <img src="gambar-dashboard.jpg" alt="App Dashboard Screenshot">
                </div>
            </div>
        </div>

        <!-- Bagian Kanan: Teks Tutorial -->
        <div class="text-section">
            <h1>Panduan <br><span>Dashboard</span></h1>
            
            <p>
                "Pertama kita masuk ke <strong>halaman dashboard</strong> dulu, kali ini kita perkenalkan <strong>fitur pembayaran</strong> dan beberapa fitur di dalamnya."
            </p>
        </div>
    </div>

</body>
</html>
