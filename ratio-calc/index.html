<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalkulator Rasio Splitter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563EB;
            --bg: #F9FAFB;
            --text: #1F2937;
            --radius: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px 16px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 400px; }
        header { text-align: center; margin-bottom: 32px; }
        header h1 { font-family: 'Outfit', sans-serif; font-size: 24px; color: var(--primary); }
        
        .result-box { background: white; padding: 24px; border-radius: var(--radius); text-align: center; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); margin-bottom: 24px; border: 1px solid #E5E7EB; }
        .result-label { font-size: 12px; font-weight: 700; color: #6B7280; text-transform: uppercase; margin-bottom: 4px; }
        .result-value { font-family: 'Outfit', sans-serif; font-size: 48px; font-weight: 800; color: var(--text); }
        
        .splitter-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
        .splitter-item { display: flex; align-items: center; gap: 12px; background: white; padding: 12px 16px; border-radius: 12px; border: 1px solid #E5E7EB; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        select { flex: 1; padding: 12px; border: 1px solid #D1D5DB; border-radius: 8px; font-size: 16px; font-weight: 600; background: #FDFDFD; }
        .remove-btn { background: #FEE2E2; color: #DC2626; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 14px; }
        
        .add-btn { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 14px rgba(37,99,235,0.2); }
        .add-btn:active { transform: scale(0.98); }
        
        footer { margin-top: auto; padding-top: 40px; text-align: center; font-size: 12px; color: #9CA3AF; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>RatioCalc</h1>
        </header>

        <div class="result-box">
            <p class="result-label">Total Rasio</p>
            <div id="total-ratio" class="result-value">1:2</div>
        </div>

        <div id="splitter-list" class="splitter-list">
            <!-- Items injected by JS -->
        </div>

        <button id="add-btn" class="add-btn">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Tambah Splitter
        </button>

        <footer>
            Alat Lapangan ISP • v1.0
        </footer>
    </div>

    <script>
        const list = document.getElementById('splitter-list');
        const totalDisplay = document.getElementById('total-ratio');
        const addBtn = document.getElementById('add-btn');

        function createItem() {
            const div = document.createElement('div');
            div.className = 'splitter-item';
            div.innerHTML = `
                <select onchange="calculate()">
                    <option value="2">1:2</option>
                    <option value="4">1:4</option>
                    <option value="8">1:8</option>
                    <option value="16">1:16</option>
                    <option value="32">1:32</option>
                </select>
                <button class="remove-btn" onclick="removeItem(this)">×</button>
            `;
            return div;
        }

        function calculate() {
            const selects = document.querySelectorAll('select');
            let total = 1;
            selects.forEach(s => total *= parseInt(s.value));
            totalDisplay.textContent = `1:${total}`;
        }

        function removeItem(btn) {
            btn.parentElement.remove();
            calculate();
        }

        addBtn.addEventListener('click', () => {
            list.appendChild(createItem());
            calculate();
        });

        // Init
        list.appendChild(createItem());
        calculate();
    </script>
</body>
</html>
